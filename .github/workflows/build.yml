name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout del código
      uses: actions/checkout@v7

    - name: Configurar Java 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Permisos de ejecución a gradlew
      run: chmod +x gradlew || true

    - name: Preparar variables de entorno (.env)
      run: cp .env.example .env 2>/dev/null || touch .env

    - name: Detectar versión de la app
      run: |
        VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
        echo "APP_VERSION=${VERSION:-1.4}" >> "$GITHUB_ENV"

    - name: Generar Keystore de Depuración si no existe
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Ejecutar pruebas unitarias
      run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

    - name: Compilar APK con Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Guardar el APK
      uses: actions/upload-artifact@v7
      with:
        name: MiniSQL-Pro-${{ env.APP_VERSION }}-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
