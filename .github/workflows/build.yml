name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Configurar el SDK de Android
      uses: android-actions/setup-android@v3

    - name: Dar permisos a gradlew
      run: chmod +x gradlew || true

    # Genera el debug.keystore necesario para firmar la app en depuración
    - name: Generar Keystore de Depuración
      run: |
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

    - name: Compilar APK con Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Guardar el APK
      uses: actions/upload-artifact@v4
      with:
        name: MiniSQL-Pro-1.0-APK
        path: app/build/outputs/apk/debug/*.apk
